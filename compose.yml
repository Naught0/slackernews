services:
  ingestor:
    image: slackernews:latest
    build: .
    command: ["node", "scripts/ingest-bundle.js"]
    restart: unless-stopped
    environment:
      SLACKER_DB_PATH: /data/cache.db
      INGEST_UPDATES_MS: "30000"
      INGEST_FEEDS_MS: "300000"
      INGEST_CONCURRENCY: "16"
      INGEST_BACKFILL: "500"
      INGEST_FEEDS: "top,best,new,ask,show,job"
    volumes:
      - cache-data:/data

  app:
    image: slackernews:latest
    build: .
    restart: unless-stopped
    environment:
      SLACKER_DB_PATH: /data/cache.db
    volumes:
      - cache-data:/data

  anubis:
    image: ghcr.io/techarohq/anubis:v1.26.2
    restart: unless-stopped
    command: ["-target", "http://app:3000"]
    environment:
      POLICY_FNAME: /data/botPolicy.yaml
    volumes:
      - ./anubis/botPolicy.yaml:/data/botPolicy.yaml:ro
    depends_on:
      - app

  nginx:
    image: nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:3006:80"
    volumes:
      - ./nginx/:/etc/nginx/
    depends_on:
      - anubis

volumes:
  cache-data:
